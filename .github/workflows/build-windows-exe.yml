name: Build Windows portable EXE

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-exe.yml'
      - 'package.json'
      - 'electron-main.js'
      - 'electron-preload.js'
      - 'index.html'
      - 'app.css'
      - 'app-core.js'
      - 'app-data.js'
      - 'app-ui.js'
      - 'app-init.js'
      - 'UNBLOCK_AKID_VIEWER.bat'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Set package version from release tag
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like v1.2.3 or 1.2.3. Got: $version"
          }
          npm version $version --no-git-tag-version

      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer bundle from sources
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const files=['app-core.js','app-data.js','app-ui.js','app-init.js']; fs.writeFileSync('app.js', files.map(f=>fs.readFileSync(f,'utf8')).join('\n'), 'utf8');"

      - name: Validate source JavaScript
        shell: pwsh
        run: |
          node --check electron-main.js
          node --check electron-preload.js
          node --check app.js

      - name: Assert fully offline runtime inputs
        shell: pwsh
        run: |
          if (Select-String -Path index.html -Pattern '<(script|link)[^>]+(src|href)="https?://' -Quiet) {
            throw 'index.html contains an external runtime dependency.'
          }
          $required = @(
            'index.html',
            'app.css',
            'app.js',
            'electron-preload.js',
            'UNBLOCK_AKID_VIEWER.bat',
            'lib/tailwind.js',
            'lib/xlsx.full.min.js',
            'lib/css/all.min.css',
            'lib/webfonts/fa-solid-900.woff2'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing offline runtime/release file: $file" }
          }

      - name: Build one portable Windows EXE
        run: npm run build:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify single-file deliverable and signature state
        id: exe
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK }}
        run: |
          $files = @(Get-ChildItem -Path dist -Filter 'AIMETON_AKID_Viewer_*_Windows_x64.exe' -File)
          if ($files.Count -ne 1) {
            throw "Expected exactly one portable EXE, found $($files.Count)."
          }
          $exe = $files[0].FullName
          Write-Host "Built: $exe"
          $sig = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Authenticode status: $($sig.Status)"
          if ($env:SIGNING_CONFIGURED) {
            if ($sig.Status -ne 'Valid') { throw "Signing credentials were configured but signature is not valid: $($sig.Status)" }
          } else {
            Write-Warning 'Code-signing is not configured. Release users can use UNBLOCK_AKID_VIEWER.bat to remove the downloaded-file Internet zone marker.'
          }
          "path=$exe" >> $env:GITHUB_OUTPUT
          "name=$($files[0].Name)" >> $env:GITHUB_OUTPUT

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMETON-AKID-Viewer-Windows-x64
          path: |
            ${{ steps.exe.outputs.path }}
            UNBLOCK_AKID_VIEWER.bat
          if-no-files-found: error

      - name: Attach Windows files to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.exe.outputs.path }}" "UNBLOCK_AKID_VIEWER.bat" --clobber
