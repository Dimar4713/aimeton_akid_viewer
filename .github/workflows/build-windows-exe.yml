name: Build Windows portable EXE

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-exe.yml'
      - 'package.json'
      - 'electron-main.js'
      - 'electron-preload.js'
      - 'electron-main-win7.js'
      - 'electron-preload-win7.js'
      - 'index.html'
      - 'app.css'
      - 'app-core.js'
      - 'app-data.js'
      - 'app-ui.js'
      - 'app-multi-assignment.js'
      - 'app-init.js'
      - 'docs/USER_GUIDE_RU.md'
      - 'docs/WINDOWS7_LEGACY.md'
      - 'scripts/build-user-guide-pdf.js'
      - 'UNBLOCK_AKID_VIEWER.bat'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Set package version from release tag
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like v1.2.3 or 1.2.3. Got: $version"
          }
          npm version $version --no-git-tag-version

      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer bundle from sources
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const files=['app-core.js','app-data.js','app-ui.js','app-multi-assignment.js','app-init.js']; fs.writeFileSync('app.js', files.map(f=>fs.readFileSync(f,'utf8')).join('\n'), 'utf8');"

      - name: Validate source JavaScript and assignment model
        shell: pwsh
        run: |
          node --check electron-main.js
          node --check electron-preload.js
          node --check electron-main-win7.js
          node --check electron-preload-win7.js
          node --check app-multi-assignment.js
          node --check app.js
          node --check scripts/build-user-guide-pdf.js
          $multi = Get-Content app-multi-assignment.js -Raw
          foreach ($needle in @('assigneesFor','setAssignees','__assigned__','Назначенные исполнители','hasAssignee')) {
            if ($multi -notmatch [regex]::Escape($needle)) { throw "Multi-assignment capability missing: $needle" }
          }

      - name: Assert fully offline runtime inputs
        shell: pwsh
        run: |
          if (Select-String -Path index.html -Pattern '<(script|link)[^>]+(src|href)="https?://' -Quiet) {
            throw 'index.html contains an external runtime dependency.'
          }
          $required = @(
            'index.html',
            'app.css',
            'app.js',
            'app-multi-assignment.js',
            'electron-preload.js',
            'electron-main-win7.js',
            'electron-preload-win7.js',
            'docs/USER_GUIDE_RU.md',
            'scripts/build-user-guide-pdf.js',
            'UNBLOCK_AKID_VIEWER.bat',
            'lib/tailwind.js',
            'lib/xlsx.full.min.js',
            'lib/css/all.min.css',
            'lib/webfonts/fa-solid-900.woff2'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing offline runtime/release file: $file" }
          }
          $html = Get-Content index.html -Raw
          if ($html -notmatch 'id="helpModal"') { throw 'Embedded help modal is missing.' }
          if ($html -notmatch 'class="help-btn"') { throw 'Help [?] button is missing.' }

      - name: Build modern Windows portable EXE
        run: npm run build:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Preserve modern EXE
        id: modern
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $files = @(Get-ChildItem -Path dist -Filter 'AIMETON_AKID_Viewer_*_Windows_x64.exe' -File)
          if ($files.Count -ne 1) { throw "Expected one modern EXE, found $($files.Count)." }
          $dest = Join-Path (Resolve-Path release-assets) $files[0].Name
          Copy-Item $files[0].FullName $dest
          "path=$dest" >> $env:GITHUB_OUTPUT
          "name=$($files[0].Name)" >> $env:GITHUB_OUTPUT

      - name: Generate PDF user guide
        shell: pwsh
        run: |
          npx electron scripts/build-user-guide-pdf.js
          $pdf = 'AIMETON_AKID_Viewer_User_Guide_RU.pdf'
          if (-not (Test-Path $pdf)) { throw 'PDF user guide was not generated.' }
          if ((Get-Item $pdf).Length -lt 20000) { throw 'PDF user guide is unexpectedly small.' }

      - name: Switch runtime to Electron 22 for Windows 7 legacy build
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false electron@22.3.27
          $electronVersion = node -p "require('electron/package.json').version"
          if ($electronVersion -ne '22.3.27') { throw "Expected Electron 22.3.27, got $electronVersion" }
          npm pkg set main=electron-main-win7.js
          npm pkg set 'build.win.artifactName=AIMETON_AKID_Viewer_${version}_Windows7_x64.${ext}'
          Write-Host "Windows 7 legacy runtime: Electron $electronVersion"

      - name: Build Windows 7 x64 legacy portable EXE
        run: npm run build:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Preserve Windows 7 legacy EXE
        id: win7
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path dist -Filter 'AIMETON_AKID_Viewer_*_Windows7_x64.exe' -File)
          if ($files.Count -ne 1) { throw "Expected one Windows 7 legacy EXE, found $($files.Count)." }
          $dest = Join-Path (Resolve-Path release-assets) $files[0].Name
          Copy-Item $files[0].FullName $dest
          "path=$dest" >> $env:GITHUB_OUTPUT
          "name=$($files[0].Name)" >> $env:GITHUB_OUTPUT

      - name: Verify deliverables and signature state
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK }}
        run: |
          foreach ($exe in @('${{ steps.modern.outputs.path }}','${{ steps.win7.outputs.path }}')) {
            if (-not (Test-Path $exe)) { throw "Missing EXE: $exe" }
            $sig = Get-AuthenticodeSignature -FilePath $exe
            Write-Host "$exe Authenticode: $($sig.Status)"
            if ($env:SIGNING_CONFIGURED -and $sig.Status -ne 'Valid') {
              throw "Signing configured but signature is not valid for ${exe}: $($sig.Status)"
            }
          }
          if (-not $env:SIGNING_CONFIGURED) {
            Write-Warning 'Code signing is not configured. UNBLOCK_AKID_VIEWER.bat remains the pilot workaround.'
          }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMETON-AKID-Viewer-Windows
          path: |
            ${{ steps.modern.outputs.path }}
            ${{ steps.win7.outputs.path }}
            UNBLOCK_AKID_VIEWER.bat
            AIMETON_AKID_Viewer_User_Guide_RU.pdf
          if-no-files-found: error

      - name: Attach Windows files to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.modern.outputs.path }}" "${{ steps.win7.outputs.path }}" "UNBLOCK_AKID_VIEWER.bat" "AIMETON_AKID_Viewer_User_Guide_RU.pdf" --clobber
