name: Publish AIMETON AKID Viewer v1.2.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.2.3.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create v1.2.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.3 >/dev/null 2>&1 || gh release create v1.2.3 \
            --target "$GITHUB_SHA" \
            --title 'AIMETON AKID Viewer v1.2.3' \
            --notes 'Исправлено отображение встроенного руководства пользователя: кнопка [?] теперь открывает отрендеренную справку с заголовками, списками, кодовыми блоками, выделениями и ссылками вместо исходного Markdown. Справка остаётся полностью офлайн и использует утверждённый docs/USER_GUIDE_RU.md как единый источник. В Release автоматически прикладываются portable EXE, UNBLOCK_AKID_VIEWER.bat и PDF-руководство.'
