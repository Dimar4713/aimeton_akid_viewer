name: Publish AIMETON AKID Viewer v1.2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.2.2.yml'

permissions:
  contents: write

env:
  RELEASE_TAG: v1.2.2
  RELEASE_VERSION: 1.2.2
  GUIDE_PDF: AIMETON_AKID_Viewer_User_Guide_RU.pdf

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Set release version
        shell: pwsh
        run: npm version $env:RELEASE_VERSION --no-git-tag-version

      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer bundle from sources
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const files=['app-core.js','app-data.js','app-ui.js','app-init.js']; fs.writeFileSync('app.js', files.map(f=>fs.readFileSync(f,'utf8')).join('\n'), 'utf8');"

      - name: Validate release inputs
        shell: pwsh
        run: |
          node --check electron-main.js
          node --check electron-preload.js
          node --check app.js
          node --check scripts/build-user-guide-pdf.js
          $required = @('index.html','app.css','app.js','electron-preload.js','docs/USER_GUIDE_RU.md','scripts/build-user-guide-pdf.js','UNBLOCK_AKID_VIEWER.bat')
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing release input: $file" } }
          $html = Get-Content index.html -Raw
          if ($html -notmatch 'class="help-btn"') { throw 'Help [?] button is missing.' }
          if ($html -notmatch 'id="helpModal"') { throw 'Help modal is missing.' }
          if ($html -notmatch 'docs/USER_GUIDE_RU.md') { throw 'Help modal is not connected to the approved guide.' }
          if ($html -match 'aimeton-brand large') { throw 'Prominent AIMETON start-screen branding returned.' }

      - name: Build portable Windows EXE
        run: npm run build:win

      - name: Generate PDF user guide
        shell: pwsh
        run: |
          npx electron scripts/build-user-guide-pdf.js
          if (-not (Test-Path $env:GUIDE_PDF)) { throw 'PDF guide missing.' }
          $size = (Get-Item $env:GUIDE_PDF).Length
          if ($size -lt 20000) { throw "PDF guide unexpectedly small: $size bytes." }
          Write-Host "Guide PDF: $env:GUIDE_PDF ($size bytes)"

      - name: Verify portable EXE
        id: exe
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path dist -Filter 'AIMETON_AKID_Viewer_1.2.2_Windows_x64.exe' -File)
          if ($files.Count -ne 1) { throw "Expected exactly one v1.2.2 EXE, found $($files.Count)." }
          $exe = $files[0].FullName
          $sig = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Authenticode status: $($sig.Status)"
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Create release if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = @"
Корпоративная pilot-версия с встроенной пользовательской справкой.

Изменения:
- добавлена кнопка [?] в правом верхнем углу приложения;
- утверждённое руководство пользователя встроено в приложение и открывается в отдельном прокручиваемом окне;
- руководство остаётся полностью локальным и доступно без Интернета;
- PDF-версия руководства приложена к Release отдельным файлом;
- сохранён нейтральный корпоративный интерфейс и ненавязчивый branding AIMETON;
- сохранены автозагрузка employees.csv и восстановление последних XLSX/CSV;
- сохранён UNBLOCK_AKID_VIEWER.bat для Internet-zone marker.
"@
            $notes | Set-Content -Path release-notes.txt -Encoding utf8
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title 'AIMETON AKID Viewer v1.2.2' --notes-file release-notes.txt
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create GitHub Release.' }
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG "${{ steps.exe.outputs.path }}" 'UNBLOCK_AKID_VIEWER.bat' $env:GUIDE_PDF --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }

      - name: Verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          $names = @($json.assets | ForEach-Object { $_.name })
          $expected = @('AIMETON_AKID_Viewer_1.2.2_Windows_x64.exe','UNBLOCK_AKID_VIEWER.bat',$env:GUIDE_PDF)
          foreach ($name in $expected) { if ($names -notcontains $name) { throw "Release asset missing: $name" } }
          Write-Host ('Release assets: ' + ($names -join ', '))
